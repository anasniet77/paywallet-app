# Database
spring.datasource.url=jdbc:mysql://mysql-1e2fc81-anaskareem672-1906.b.aivencloud.com:21214/defaultdb?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Render / Spring Boot HTTP port
server.port=${PORT:8080}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${spring.mail.username}
spring.mail.password=${spring.mail.password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio
twilio.account.sid=${twilio_account_sid}
twilio.auth.token=${twilio_auth_token}
twilio.phone.number=${twilio_phone_number}

# Razorpay
razorpay.key.id=${razorpay.key.secret}
razorpay.key.secret=${razorpay.key.id}
